<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Portafolio de iniciativas y proyectos sociales de la Fundación A+, con programas estratégicos de alto impacto comunitario y formación en el Pacífico colombiano." />
  <meta name="theme-color" content="#F8FAFC" />
  <title>Proyectos e Iniciativas A+ · Fundación A+</title>
  <!-- Favicon con el logo oficial de Fundación A+. -->
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/aplus-module.css" />

  <!-- Solo para la página independiente: el módulo no estiliza nada fuera de #aplus-module-root. -->
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background-color: #F8FAFC;
      background-image:
        radial-gradient(at 15% 10%, rgba(139, 92, 246, 0.08) 0px, transparent 45%),
        radial-gradient(at 85% 15%, rgba(31, 200, 192, 0.08) 0px, transparent 45%),
        radial-gradient(at 50% 85%, rgba(240, 69, 92, 0.04) 0px, transparent 50%);
      background-attachment: fixed;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <!-- =====================================================================
         Raíz del módulo. Para incrustarlo en la plataforma principal, copia
         este bloque completo (desde #aplus-module-root hasta su cierre).
         ===================================================================== -->
    <div id="aplus-module-root">
      <section class="aplus-module" aria-labelledby="aplus-title">

        <header class="aplus-header">
          <p class="aplus-header__eyebrow">Fundación A+ · Portafolio Social &amp; Territorial</p>
          <h1 class="aplus-header__title" id="aplus-title">Proyectos e Iniciativas A+</h1>
          <p class="aplus-header__subtitle">
            Explora los proyectos de impacto de la Fundación A+ y descubre las iniciativas
            <strong>A+</strong>: programas de alta transformación social, efecto multiplicador
            comunitario y prioridad territorial inmediata.
          </p>
          <ul class="aplus-metrics" aria-label="Resumen del portafolio" data-aplus-metrics></ul>
        </header>

        <noscript>
          <p class="aplus-noscript">
            Este módulo necesita JavaScript para mostrar los proyectos e iniciativas.
            Actívalo en tu navegador y recarga la página.
          </p>
        </noscript>

        <div data-aplus-filters></div>
        <div data-aplus-list></div>
      </section>

      <!-- Contenedor del modal de detalle (se monta dentro del root para heredar los estilos). -->
      <div data-aplus-modal-host></div>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
